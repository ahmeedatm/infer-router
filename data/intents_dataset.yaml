  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-security-anomaly-isolation-slice-quarantine
  text: The Near-RT RIC security xApp has flagged abnormal PDCP SDU injection patterns on gNB-2101 consistent with a rogue UE attempting a denial-of-service on the URLLC slice for critical infrastructure (tenant TN-CRIT-03). Isolate the suspected UE by revoking its radio bearer without disrupting other UEs on the cell, trigger AUSF re-authentication for all UEs on the affected slice, enforce a temporary PRB rate cap on any UE failing re-authentication, ensure TN-CRIT-03 latency SLA (1 ms) and packet loss SLA (10^-6) are maintained throughout the quarantine procedure, and coordinate with the SMF to suspend the rogue UE's PDU session on the N1/N2 interface without causing a paging flood on gNB-2102 and gNB-2103.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
