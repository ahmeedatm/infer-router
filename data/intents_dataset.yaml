  expected_complexity: complex
  criticality: med
  slice_type: null
- id: ran-multi-tenant-admission-revenue-isolation
  text: 'Four incoming slice instantiation requests are queued for the shared gNB-330 to gNB-335 cluster: one critical-infrastructure URLLC (guaranteed bit rate 50 Mbps, isolation level = full PRB partitioning), one V2X URLLC (latency <= 3 ms), and two eMBB tenants requesting best-effort expansion. Current PRB load is 82 percent. Determine the admission set and per-slice resource reservation that maximises total committed revenue while ensuring that neither URLLC slice''s SLA is compromised and that eMBB admitted tenants receive at least 10 Mbps guaranteed downlink each.'
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-handover-storm-prevention-dense-urban
  text: The dense urban cluster spanning gNB-401 through gNB-412 is experiencing a ping-pong handover rate of 28 events per minute per cell during a crowded event, degrading PDCP reordering and causing RLC retransmissions to spike above 8 percent. Tune A3 event offset, hysteresis, and time-to-trigger parameters across all 12 cells jointly so that handover ping-pong drops below 5 events per minute without allowing any cell's PRB utilisation to exceed 90 percent or edge-user SINR to fall below 3 dB.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: embb
- id: ran-cross-layer-qos-congestion-uplink
  text: 'gNB-550 uplink is congested: PUSCH PRB utilisation is at 94 percent, average UE transmit power is at maximum (23 dBm), and MCS is falling to index 4 for 30 percent of UEs. Simultaneously, an active URLLC slice for remote surgery requires uplink latency <= 1 ms and packet loss <= 10^-5. Reconfigure uplink scheduler weights, power control parameters (P0, alpha), and if necessary trigger conditional handover of non-critical eMBB UEs to neighbouring gNB-551 or gNB-552, without breaching the URLLC SLA or reducing mMTC device uplink access probability below 99.5 percent.'
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-energy-harvest-sleep-cycle-rural-cluster
  text: Rural gNB cluster {gNB-601, gNB-602, gNB-603, gNB-604} operates on a shared power grid with a renewable energy budget of 2.4 kWh per cell per hour during night hours. Design a coordinated cell-sleep and carrier-shutdown schedule across all four cells that keeps total energy draw within budget, maintains coverage overlap so that no registered mMTC device loses connectivity, and preserves the eMBB SLA (minimum 10 Mbps DL) for any UE that remains active, accounting for the fact that gNB-603 carries the only backhaul path for gNB-604.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: mmtc
- id: ran-dynamic-spectrum-sharing-nr-lte-coexistence
  text: Spectrum band 2.1 GHz is shared between an LTE macro layer (eNB-700) and an NR layer (gNB-701) via dynamic spectrum sharing. The NR layer must serve a URLLC slice for drone corridor management (latency <= 2 ms, reliability 99.999 percent) while the LTE layer must not see its VoLTE MOS drop below 3.8. Compute a per-subframe PRB lending policy between eNB-700 and gNB-701 that satisfies both SLAs simultaneously and maximises NR eMBB throughput with any remaining resources, given that the total available PRBs in the band are 100 and the LTE baseline reservation is 40 PRBs.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-slice-reconfig-capacity-crunch-stadium
  text: 'A stadium event is starting in 45 minutes. gNB-801 and gNB-802 are projected to reach 95 percent PRB saturation based on historical crowd models. Three active slices are present: eMBB-public (best effort), eMBB-broadcast (committed 200 Mbps aggregate downlink for live video), and URLLC-safety (committed latency <= 5 ms for security personnel PTT). Reconfigure slice resource quotas, activate carrier aggregation on the n78 secondary component carrier, and pre-position UPF anchor for the broadcast slice at the edge node closest to gNB-801, all without interrupting any currently active session and without violating the safety slice SLA at any point during reconfiguration.'
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: embb
- id: ran-interference-coordination-hetnet-smallcell
  text: 'A heterogeneous network layer comprising macro gNB-901 and six small cells {SC-901-A through SC-901-F} is experiencing inter-layer interference: CQI on the small cells averages 5 due to pilot contamination from gNB-901. Implement enhanced inter-cell interference coordination (eICIC) with almost-blank subframe (ABS) patterns on gNB-901, jointly optimising ABS ratio, small-cell transmit power, and UE association policy so that small-cell average CQI rises above 9, macro-layer eMBB throughput loss stays below 10 percent, and the URLLC slice latency on SC-901-C (serving a manufacturing line) remains below 2 ms.'
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-predictive-capacity-scaling-ml-kpi
  text: Based on 30-day traffic telemetry from gNB-1001 through gNB-1006, the O-RAN Non-RT RIC has identified a recurring capacity shortfall every weekday between 08:00 and 09:30 where PRB utilisation exceeds 88 percent and average DL PDCP throughput drops 22 percent. Design a proactive intent that pre-activates additional TRX chains, adjusts scheduler MCS upper bounds, and pre-scales the associated SMF session capacity 20 minutes before the predicted onset, while ensuring that the nightly energy-saving mode is not prematurely terminated and that mMTC device registration storms are not triggered by the reconfiguration.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: embb
- id: ran-multiband-carrier-aggregation-qoe-optimise
  text: UEs in the gNB-1101 coverage area are eligible for five-carrier aggregation across n1, n3, n28, n77, and n258 bands. Optimise the per-UE carrier aggregation configuration and scheduling split across carriers such that aggregate DL throughput per UE exceeds 1.2 Gbps for premium eMBB subscribers, uplink latency for URLLC UEs stays below 1 ms on the primary carrier, mmWave n258 beam management overhead does not consume more than 5 percent of total air-time, and total radiated power remains within the 46 dBm EIRP regulatory limit across all component carriers simultaneously.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: embb
- id: ran-disaster-recovery-coverage-restoration
  text: gNB-1201 has failed due to a power outage, leaving 3.2 km² of urban area uncovered. Neighbouring cells {gNB-1202, gNB-1203, gNB-1204, gNB-1205} must expand coverage via tilt adjustment and power boosting to restore service. Simultaneously, the URLLC slice for emergency-services communications (latency <= 3 ms, isolation = dedicated PRB pool) must be migrated to gNB-1202 without session interruption, the eMBB SLA for remaining cells must not degrade by more than 20 percent, and the aggregate energy increase across the four cells must not exceed 15 percent above their current baseline draw.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-o-ran-near-rt-ric-xapp-conflict-resolution
  text: 'Two xApps deployed on the Near-RT RIC for gNB-1301 are issuing conflicting E2 control messages: xApp-A is attempting to reduce CIO for cell gNB-1301 to offload UEs to gNB-1302, while xApp-B is simultaneously increasing transmit power on gNB-1301 to improve RSRP for edge UEs. Resolve the conflict by computing a joint policy that satisfies both xApp objectives within their stated KPI bounds (handover rate < 8 per minute, edge RSRP > -108 dBm), enforces the URLLC slice latency SLA of 2 ms, and does not push PRB utilisation above 85 percent on either cell.'
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-network-slicing-isolation-audit-remediation
  text: A compliance audit on the shared gNB cluster {gNB-1401, gNB-1402, gNB-1403} has revealed that the URLLC slice for financial trading (tenant ID TN-FIN-07) and the eMBB slice for public broadband (tenant ID TN-PUB-02) are sharing scheduler queues in violation of the isolation SLA. Remediate by enforcing strict PRB partitioning and separate PDCP/RLC instances for TN-FIN-07, re-validate that TN-FIN-07 latency is <= 1 ms and packet loss <= 10^-6, ensure TN-PUB-02 throughput does not drop below its committed 50 Mbps, and produce a remediation plan that can be executed with zero downtime for either tenant.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-joint-dl-ul-decoupling-load-split
  text: In the suburban cluster {gNB-1501, gNB-1502, gNB-1503}, downlink traffic is 6x uplink traffic, causing asymmetric PRB waste. Implement downlink-uplink decoupling so that UEs associate to different cells for DL and UL based on RSRP and RSRQ measurements, optimise the association thresholds jointly across all three cells, ensure that the resulting X2/Xn signalling overhead stays below 5 percent of backhaul capacity (backhaul capacity = 10 Gbps per link), and verify that the eMBB DL throughput SLA and the mMTC UL reachability SLA are both met after decoupling.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: embb
- id: ran-coordinated-multipoint-coherent-joint-tx
  text: UEs at the cell-edge boundary between gNB-1601 and gNB-1602 are experiencing SINR below -2 dB and DL throughput below 5 Mbps. Activate coherent joint transmission CoMP (JT-CoMP) between gNB-1601 and gNB-1602, optimise precoding weights and power allocation across both transmission points, ensure that the additional fronthaul load on the shared F1 interface does not exceed 80 percent of its 25 Gbps capacity, and confirm that the URLLC slice latency budget of 3 ms is preserved end-to-end including the additional CoMP processing delay, without degrading centre-cell UE throughput by more than 8 percent.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: embb
- id: ran-amf-load-rebalance-slice-aware-registration
  text: 'AMF pool {AMF-01, AMF-02, AMF-03} serving gNB cluster {gNB-1701 through gNB-1710} is experiencing AMF-01 at 91 percent registration capacity while AMF-02 and AMF-03 are at 45 percent. Rebalance UE registrations across the AMF pool in a slice-aware manner: URLLC UEs must remain anchored to AMF-01 (which has the lowest N2 latency to the RAN), eMBB and mMTC UEs should be redistributed to AMF-02 and AMF-03, and the rebalancing must not trigger simultaneous re-registration storms that would exceed 500 registration requests per second on any single AMF, while keeping total NAS signalling latency below 50 ms.'
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: null
- id: ran-qos-flow-remap-upf-relocation-latency
  text: A fleet of autonomous guided vehicles operating in warehouse zone WH-7 is connected via gNB-1801 to UPF-EDGE-03, which is experiencing 12 ms N3 latency due to a routing anomaly. The URLLC slice SLA requires end-to-end latency <= 5 ms. Relocate the UPF anchor for the affected PDU sessions to UPF-EDGE-01 (measured N3 latency 2 ms), remap QoS flows accordingly via the SMF, ensure that the handover of GTP-U tunnels on the N3 interface causes no packet loss exceeding 0.001 percent, and confirm that the eMBB slice sharing gNB-1801 is not disrupted during the UPF relocation procedure.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-mmtc-massive-access-congestion-prb-guard
  text: A firmware push to 80 000 mMTC devices registered across gNB cluster {gNB-1901 through gNB-1908} is scheduled to begin at 02:00. The resulting RACH preamble collision rate is projected to exceed 40 percent, causing access failures. Design a staggered access barring and back-off configuration across all eight cells that keeps RACH collision rate below 5 percent, ensures firmware delivery completes within a 4-hour window, reserves a PRB guard band for the co-located URLLC slice (latency SLA 2 ms), and does not cause any eMBB UE to experience a radio link failure during the access surge.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: mmtc
- id: ran-son-self-healing-coverage-capacity-joint
  text: 'SON engine has detected that gNB-2001 has a mechanical tilt fault causing a 4 dB coverage hole to the north, while gNB-2002 to the east is simultaneously capacity-limited at 89 percent PRB utilisation due to UE migration from the degraded cell. Trigger a joint self-healing action: remotely adjust electrical tilt on gNB-2001 neighbours {gNB-2003, gNB-2004} to partially fill the coverage hole, offload excess UEs from gNB-2002 to gNB-2005 via load-based handover, maintain the URLLC slice SLA (latency <= 2 ms) throughout the reconfiguration, and ensure that the corrective actions do not create a new coverage hole or push any neighbour cell above 85 percent PRB load.'
