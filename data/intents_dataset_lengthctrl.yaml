intents:
- id: ran-read-rsrp-cell
  text: What is the current RSRP value being reported by UEs attached to cell gNB-207 sector 1 right now? I need to verify signal strength is within acceptable bounds for our morning peak traffic period before the operations team closes the overnight maintenance window on that site.
  domain: ran
  expected_complexity: simple
  criticality: low
  slice_type: null
- id: ran-read-cqi-gnb
  text: Can you show me the average CQI reported by UEs on gNB-315 sector 3 at this moment? We had a fiber splice nearby yesterday and the field team wants confirmation that channel quality has returned to baseline levels before signing off on the repair ticket.
  domain: ran
  expected_complexity: simple
  criticality: med
  slice_type: embb
- id: ran-read-active-ues
  text: How many UEs are currently active and in RRC connected state on cell gNB-089 sector 2? The capacity planning team needs this figure to validate their busy-hour model for the upcoming stadium event scheduled in that coverage area this weekend.
  domain: ran
  expected_complexity: simple
  criticality: low
  slice_type: null
- id: ran-read-prb-ul-sector
  text: What is the uplink PRB utilization percentage on gNB-441 sector 1 right now? Our NOC dashboard flagged a possible congestion alert for that sector during the last polling cycle and we need a direct confirmation before escalating to the on-call RF engineer.
  domain: ran
  expected_complexity: simple
  criticality: med
  slice_type: null
- id: ran-read-sinr-cell
  text: Show me the current average SINR measured on the downlink of cell gNB-130 sector 2. We are evaluating whether a recent antenna tilt adjustment performed by the field crew this morning has improved interference conditions compared to the pre-maintenance baseline reading.
  domain: ran
  expected_complexity: simple
  criticality: low
  slice_type: null
- id: ran-read-handover-success-rate
  text: What is the handover success rate for gNB-502 sector 1 over the last measurement interval? The RF team suspects a neighbour list misconfiguration introduced during last night's parameter push and wants to confirm current handover performance before rolling back the change.
  domain: ran
  expected_complexity: simple
  criticality: med
  slice_type: null
- id: ran-read-urllc-latency-cell
  text: What is the current one-way user-plane latency observed on the URLLC slice at gNB-310 sector 2? The industrial automation customer on that site has raised a ticket claiming control-loop delays, and we need a baseline measurement to determine whether the issue originates in the RAN segment.
  domain: ran
  expected_complexity: simple
  criticality: high
  slice_type: urllc
- id: ran-read-bler-downlink
  text: What is the downlink block error rate on gNB-228 sector 3 at this moment? We are conducting a post-upgrade sanity check following last night's software update on that base station and need to confirm BLER is within the acceptable threshold before marking the upgrade as successful.
  domain: ran
  expected_complexity: simple
  criticality: med
  slice_type: embb
- id: ran-read-cell-availability
  text: Is cell gNB-175 sector 1 currently available and serving traffic, or is it in an out-of-service state? The field team reported a power fluctuation at that tower site an hour ago and we need to confirm operational status before dispatching a technician for a physical inspection visit.
  domain: ran
  expected_complexity: simple
  criticality: high
  slice_type: null
- id: ran-read-mmtc-connected-devices
  text: How many mMTC devices are currently registered and transmitting on gNB-093 sector 2 at this point in time? The IoT operations team is auditing device density across all NB-IoT enabled cells in the eastern region and needs a current count for this particular sector.
  domain: ran
  expected_complexity: simple
  criticality: low
  slice_type: mmtc
- id: ran-read-ta-value
  text: What is the timing advance value distribution currently observed for UEs on gNB-360 sector 1? The planning team wants to estimate the effective cell radius for a coverage audit report and needs the current TA spread as an input to their distance calculation model.
  domain: ran
  expected_complexity: simple
  criticality: low
  slice_type: null
- id: ran-read-dl-throughput-embb
  text: What is the current aggregate downlink throughput on the eMBB slice at gNB-415 sector 3? Our SLA monitoring system triggered a threshold warning for that slice and we need a direct KPI read to determine whether actual throughput is degraded or if the alert was a false positive.
  domain: ran
  expected_complexity: simple
  criticality: med
  slice_type: embb
- id: ran-read-rrc-setup-success
  text: What is the RRC setup success rate on gNB-271 sector 2 right now? We received a complaint from a corporate customer whose office building is served by that cell, reporting frequent call drops, and we want to check connection establishment performance as the first diagnostic step.
  domain: ran
  expected_complexity: simple
  criticality: med
  slice_type: null
- id: ran-read-beam-index-active
  text: Which beam index is currently dominant for the majority of UEs on gNB-388 sector 1? The antenna team performed a beamforming weight update this morning and needs to confirm that the expected beam direction is being selected by the scheduler before finalising the configuration change.
  domain: ran
  expected_complexity: simple
  criticality: low
  slice_type: null
- id: ran-read-interference-level
  text: What is the current inter-cell interference level reported on the uplink of gNB-144 sector 3? A neighbouring operator recently activated a new site in that area and we suspect external interference may be affecting our uplink performance, so we need the current measurement to investigate.
  domain: ran
  expected_complexity: simple
  criticality: med
  slice_type: null
- id: ran-read-paging-success-rate
  text: What is the paging success rate on gNB-056 sector 1 at this moment? Our network analytics platform detected an anomaly in paging response times for that cell during the last hour and we need a current success rate figure to determine whether the issue is ongoing or has already self-resolved.
  domain: ran
  expected_complexity: simple
  criticality: med
  slice_type: null
- id: ran-read-sector-tx-power
  text: What is the current transmit power level configured and active on gNB-299 sector 2? Following an automatic power control adjustment triggered by the SON function overnight, the RF team wants to verify the actual radiated power is consistent with the intended target value set in the policy.
  domain: ran
  expected_complexity: simple
  criticality: low
  slice_type: null
- id: ran-read-urllc-prb-usage
  text: What percentage of PRBs is the URLLC slice currently consuming on gNB-501 sector 1? The slice resource manager needs this reading to confirm that the guaranteed resource block allocation defined in the slice template is being honoured by the scheduler under current traffic load conditions.
  domain: ran
  expected_complexity: simple
  criticality: high
  slice_type: urllc
- id: ran-read-csi-rs-periodicity
  text: What is the CSI-RS periodicity currently configured on gNB-333 sector 2? The RAN configuration audit team is cross-checking parameter consistency across all gNBs in the northern cluster and needs to confirm this value matches the standardised template before closing the audit report.
  domain: ran
  expected_complexity: simple
  criticality: low
  slice_type: null
- id: ran-read-dl-modulation-scheme
  text: What is the dominant downlink modulation scheme being used for UEs on gNB-467 sector 3 right now? The capacity team wants to understand whether channel conditions are good enough to sustain 256-QAM or whether the scheduler is falling back to lower order modulation due to current propagation conditions.
  domain: ran
  expected_complexity: simple
  criticality: low
  slice_type: embb
- id: ran-read-cell-load-index
  text: What is the current cell load index for gNB-182 sector 1 at this moment? Our automated congestion detection system flagged this cell as approaching its capacity threshold during the last five-minute reporting window and we need a real-time confirmation before triggering a load balancing action.
  domain: ran
  expected_complexity: simple
  criticality: med
  slice_type: null
- id: ran-correlate-prb-cqi-drop
  text: PRB utilization on cell gNB-205 has climbed above 90% while average CQI dropped from 12 to 7 in the last 30 minutes. Determine whether the CQI degradation is caused by congestion on that cell or by interference from neighbor gNB-206, and recommend which parameter to adjust first.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-diagnose-rsrp-boundary-drop
  text: RSRP measurements on the southern edge of cell gNB-311 have fallen below -110 dBm for the past two hours, affecting roughly 40 UEs. Identify whether the root cause is antenna downtilt misconfiguration or transmit power reduction applied during last night's maintenance window on gNB-311.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-rebalance-load-gnb-pair
  text: Cell gNB-101 is carrying 85% PRB load while adjacent gNB-102 sits at 30% load. Reconfigure the handover hysteresis margin between these two cells to redistribute UEs and bring gNB-101 below the 70% PRB utilization threshold during peak hours.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-urllc-latency-breach-cell
  text: Over-the-air latency on URLLC slice in cell gNB-089 exceeded the 1 ms user-plane budget three times this hour. Identify whether the breach correlates with scheduling priority misconfiguration or with a sudden increase in eMBB traffic competing for the same PRB pool on gNB-089.
  domain: ran
  expected_complexity: medium
  criticality: high
  slice_type: urllc
- id: ran-antenna-tilt-interference-check
  text: Co-channel interference reports from gNB-415 indicate SINR below 5 dB for indoor UEs. Evaluate whether increasing the electrical downtilt on gNB-415 from 4° to 7° would reduce the interference without creating a coverage gap on the cell edge toward gNB-416.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: null
- id: ran-mmtc-prb-quota-enforcement
  text: mMTC slice on gNB-330 is consuming more PRBs than its configured 10% quota during overnight sensor reporting windows. Verify whether the slice admission control policy on gNB-330 is enforcing the PRB cap correctly and recommend a corrective parameter change if it is not.
  domain: ran
  expected_complexity: medium
  criticality: low
  slice_type: mmtc
- id: ran-handover-ping-pong-gnb-cluster
  text: UE mobility traces show repeated ping-pong handovers between gNB-220 and gNB-221 for UEs travelling along route corridor R-7. Determine the optimal A3 offset adjustment on the gNB-220 to gNB-221 neighbor relation to suppress the ping-pong while keeping handover success rate above 98%.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-power-saving-off-peak-cell
  text: Cell gNB-178 carries fewer than 5 active UEs between 02:00 and 05:00 local time every night. Assess whether activating the 3GPP energy-saving cell-switch-off feature on gNB-178 during that window is feasible given coverage overlap with gNB-179 and gNB-180, and confirm no URLLC sessions would be dropped.
  domain: ran
  expected_complexity: medium
  criticality: low
  slice_type: null
- id: ran-beamforming-weight-mismatch
  text: Massive MIMO beamforming weights on gNB-502 sector 3 have not been updated since the last RU firmware upgrade two weeks ago. Determine whether the stale weights are causing the observed 3 dB throughput loss for UEs in the 60°–90° azimuth range and trigger a weight recalibration if confirmed.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-ssburst-periodicity-adjustment
  text: Initial access failures on gNB-067 increased by 15% after the last configuration push. Investigate whether the SS burst periodicity was inadvertently changed from 20 ms to 40 ms during that push, and restore the original value if it is the confirmed cause of the access failures.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: null
- id: ran-cqi-feedback-timer-embb
  text: Average downlink throughput on the eMBB slice in cell gNB-144 dropped by 20% following a parameter audit last Tuesday. Check whether the CQI reporting periodicity timer was extended beyond the recommended 10 ms interval during the audit, and revert it to restore the adaptive modulation and coding performance.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-rach-congestion-diagnosis
  text: RACH contention failures on gNB-390 are spiking every morning at 08:00 when factory shift workers arrive and power on devices simultaneously. Determine whether increasing the number of available PRACH preambles or adjusting the back-off indicator parameter would better reduce the contention collision rate below 2%.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: mmtc
- id: ran-inter-freq-ho-threshold-tune
  text: UEs on gNB-255 are not handing over to the available 2.1 GHz layer despite strong RSRP on that frequency. Verify whether the B1 measurement threshold for inter-frequency handover on gNB-255 is set too high and recommend a revised value that triggers offload while avoiding unnecessary layer changes.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-dl-scheduler-weight-urllc
  text: URLLC PDU sessions on gNB-073 are experiencing jitter above 0.5 ms during peak eMBB traffic periods. Examine whether the downlink scheduler weight assigned to the URLLC slice on gNB-073 is sufficient to preempt eMBB transmissions and propose an adjusted weight value to meet the jitter budget.
  domain: ran
  expected_complexity: medium
  criticality: high
  slice_type: urllc
- id: ran-pci-confusion-neighbor-cells
  text: Drive-test logs near gNB-601 show PCI confusion symptoms with a neighboring cell. Identify which specific neighbor cell shares a conflicting PCI modulo-3 value with gNB-601, and recommend a PCI reassignment that resolves the confusion without disrupting the existing neighbor relation table.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: null
- id: ran-uplink-interference-band-check
  text: Uplink SINR on gNB-188 band n78 degraded from 18 dB to 9 dB over the past 48 hours with no change in traffic load. Correlate the degradation timeline with any newly activated cells in the vicinity and determine whether an external interference source or a new gNB deployment is responsible.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: null
- id: ran-ric-xapp-anomaly-gnb
  text: The traffic-steering xApp deployed on the near-RT RIC is generating unexpected A1 policy updates targeting gNB-310 every 30 seconds, causing oscillating handovers. Determine whether the xApp conflict-mitigation logic is malfunctioning and whether temporarily suspending the xApp policy on gNB-310 would stabilize handover rates.
  domain: ran
  expected_complexity: medium
  criticality: high
  slice_type: embb
- id: ran-embb-slice-throughput-cap
  text: Peak downlink throughput on the eMBB slice in cell gNB-450 is capped at 150 Mbps even though PRB utilization is only 55%. Investigate whether the slice maximum bit-rate parameter in the RAN slice profile for gNB-450 is set below the radio channel capacity and adjust it to the correct value.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-coverage-overlap-audit-cells
  text: Pilot pollution is suspected in the area covered by gNB-712, gNB-713, and gNB-714, where more than four cells are detectable above -85 dBm RSRP simultaneously. Identify which cell among the three is the primary contributor to the overlap and recommend a transmit power reduction to alleviate the pilot pollution.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: null
- id: ran-ta-timer-battery-mmtc
  text: Battery-constrained IoT devices on the mMTC slice served by gNB-560 are reporting excessive Tracking Area Update signaling, draining device batteries faster than expected. Evaluate whether extending the T3512 timer value on gNB-560 would reduce TAU frequency while keeping device reachability within acceptable bounds for the slice SLA.
  domain: ran
  expected_complexity: medium
  criticality: low
  slice_type: mmtc
- id: ran-sector-swap-verification
  text: A physical sector swap was performed on gNB-830 during last weekend's maintenance. Post-swap drive tests show azimuth coverage patterns inconsistent with the planned configuration. Confirm whether the antenna feeder labeling on gNB-830 sectors 1 and 2 was swapped during installation and identify the corrective action required.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: null
- id: ran-prb-arbitration-mixed-slices
  text: gNB-101 through gNB-108 are hosting concurrent eMBB, URLLC, and mMTC slices at 92 percent PRB utilisation. Arbitrate PRB allocation across all three slice types, preserve URLLC latency below 1 ms, maintain mMTC device reachability, and cap eMBB throughput degradation at 15 percent.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-handover-energy-sinr-tradeoff
  text: Cells gNB-210 and gNB-211 overlap a highway corridor where UE velocity exceeds 120 km/h. Tune handover hysteresis and TTT jointly across both cells to minimise ping-pong events, sustain edge SINR above -3 dB, and not exceed the Xn signalling budget of 500 messages per minute.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: embb
- id: ran-massive-mimo-beam-slice-isolation
  text: On gNB-305, massive MIMO beams serving URLLC industrial UEs on slice S-07 must not share spatial layers with eMBB UEs on slice S-02. Reconfigure beam codebook and scheduler weights to enforce spatial isolation while keeping aggregate cell throughput above 2 Gbps during the day shift.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-sleep-mode-coverage-sla
  text: During 02:00–05:00, the suburban cluster gNB-400 to gNB-415 consumes 340 kWh nightly. Schedule deep-sleep cycles per cell so total energy drops by 40 percent, residual active cells maintain -105 dBm RSRP coverage for mMTC sensors, and eMBB SLA uptime remains at 99.5 percent.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: mmtc
- id: ran-cqi-adaptive-mcs-multi-gnb
  text: CQI reports from UEs attached to gNB-501, gNB-502, and gNB-503 show bimodal distribution indicating mixed LOS and NLOS conditions. Adapt MCS selection tables per cell and per slice, ensuring URLLC BLER stays below 1e-5 and eMBB spectral efficiency does not fall below 4 bits per symbol on average.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-inter-freq-load-energy-balance
  text: 'Carrier f1 at 3.5 GHz and f2 at 700 MHz on gNB-cluster-C are imbalanced: f1 at 88 percent PRB load, f2 at 31 percent. Steer UEs between carriers using B1 measurement events, maintain URLLC latency SLA on f1, and reduce total transmit power by at least 20 percent by migrating eMBB UEs to f2.'
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: embb
- id: ran-ran-slice-admission-revenue-cap
  text: Four new eMBB slice requests from tenants T-Alpha, T-Beta, T-Gamma, and T-Delta arrive simultaneously at gNB-cluster-D already at 78 percent PRB. Admit the combination that maximises rental revenue, guarantees existing URLLC slice S-03 its reserved 20 percent PRB, and keeps average cell load below 95 percent.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: embb
- id: ran-uplink-interference-mitigation-multi-cell
  text: Uplink interference from industrial IoT devices on gNB-601 is elevating the noise floor on adjacent gNB-602 and gNB-603, degrading PUSCH SINR by 8 dB. Coordinate fractional frequency reuse and power control parameters across all three cells to restore SINR while preserving mMTC device battery life constraints.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: mmtc
- id: ran-oran-rapp-policy-conflict
  text: 'Two rApps deployed on the Non-RT RIC are issuing conflicting PRB quota policies for gNB-701: rApp-A targets energy saving, rApp-B targets throughput maximisation. Resolve the conflict by computing a Pareto-optimal policy that satisfies the eMBB SLA floor of 500 Mbps and the energy budget ceiling of 200 W simultaneously.'
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: embb
- id: ran-dual-connectivity-split-optimise
  text: UEs in the stadium venue use EN-DC with gNB-801 as master and en-gNB-802 as secondary. Traffic split ratio must be dynamically adjusted across 12 000 concurrent UEs to maximise aggregate throughput, keep X2 bearer setup latency below 10 ms, and not exceed the backhaul N3 link capacity of 10 Gbps.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: embb
- id: ran-tdd-pattern-urllc-embb-coexist
  text: gNB-cluster-E uses TDD on 3.7 GHz. Current DDDSU pattern causes 2 ms latency spikes for URLLC slice S-11 during uplink subframes. Reconfigure TDD pattern across gNB-901 to gNB-906, satisfy URLLC one-way latency of 0.5 ms, and maintain eMBB downlink peak rate above 1.5 Gbps per cell.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-coverage-capacity-tradeoff-rural
  text: Rural cluster gNB-1001 to gNB-1005 must simultaneously extend RSRP coverage to -112 dBm at cell edge for mMTC agriculture sensors, support an eMBB throughput SLA of 50 Mbps for broadband users, and limit total radiated power to comply with the 43 dBm EIRP regulatory cap per sector.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: mmtc
- id: ran-xapp-conflict-latency-energy
  text: Three xApps on the Near-RT RIC targeting gNB-1101 are simultaneously adjusting scheduler weights, transmit power, and antenna tilt. Their combined effect violates the URLLC latency SLA of 1 ms. Arbitrate xApp control loops with priority ordering so latency SLA is met and energy consumption stays within the 250 W cell budget.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-multi-tenant-qos-isolation-audit
  text: Tenants T-1 through T-5 share gNB-cluster-F under a network sharing agreement. An audit reveals T-3 eMBB traffic is consuming PRBs reserved for T-1 URLLC slice S-21. Enforce strict PRB isolation per tenant, recalculate scheduling weights, and restore T-1 latency below 2 ms without terminating T-3 sessions abruptly.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-disaster-recovery-reconfig-multi-gnb
  text: gNB-1201 has failed, leaving 4 200 UEs unserved. Redistribute load across gNB-1202, gNB-1203, and gNB-1204, ensuring URLLC public-safety slice S-31 retains dedicated PRBs, eMBB UEs experience no more than 25 percent throughput reduction, and Xn handover completion rate stays above 98 percent during reattachment surge.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-spectral-efficiency-antenna-tilt-joint
  text: Cells gNB-1301, gNB-1302, and gNB-1303 form a tri-sector site in a dense urban area. Jointly optimise electrical antenna tilt and azimuth across all three sectors to maximise average spectral efficiency, keep inter-cell interference below -6 dB SINR degradation threshold, and not disturb the URLLC slice S-41 latency budget.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: embb
- id: ran-congestion-backhaul-aware-scheduling
  text: Backhaul link on gNB-1401 is saturated at 98 percent of its 1 Gbps N3 capacity during evening peak. Adjust downlink scheduler to prioritise URLLC slice S-51 packets, throttle best-effort eMBB flows, and coordinate with gNB-1402 to offload 30 percent of eMBB UEs via Xn without breaching either cell's PRB limit.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-energy-harvest-aware-mmtc-scheduling
  text: mMTC sensors on slice S-61 attached to gNB-1501 through gNB-1504 are energy-harvesting devices with a 10 mW power budget. Schedule uplink transmissions to cluster access windows, avoid collisions with eMBB PUSCH on the same PRBs, and ensure each sensor achieves at least one successful report per 60-second cycle.
  domain: ran
  expected_complexity: complex
  criticality: low
  slice_type: mmtc
- id: ran-load-sla-revenue-joint-optimise
  text: 'gNB-cluster-G serves three paying tenants with differentiated SLAs: Tenant-A requires 99.99 percent URLLC availability, Tenant-B requires 200 Mbps eMBB guaranteed, Tenant-C is best-effort. Maximise Tenant-C throughput as residual revenue, while holding Tenant-A and Tenant-B SLAs and keeping total PRB utilisation below 90 percent.'
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-interference-coordination-hetnet
  text: A dense small-cell layer of 18 pico-gNBs underlays macro gNB-1601 in a shopping mall. Co-channel interference degrades RSRP on pico cells by 10 dB during peak hours. Coordinate power control and PRB muting between macro and pico layers, maintain eMBB throughput SLA, and keep URLLC slice S-71 latency under 1 ms.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-slice-lifecycle-reconfig-zero-touch
  text: Slice S-81 on gNB-1701 to gNB-1706 must be reconfigured from eMBB to URLLC profile to support an incoming autonomous vehicle trial starting in 90 minutes. Migrate resource reservations, update scheduler policies, re-anchor UPF traffic paths via N3, and verify end-to-end latency below 2 ms before trial start without impacting adjacent slice S-82.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: core-read-smf-sessions-active
  text: How many active PDU sessions is SMF smf-central-03 currently managing across all connected UPFs in the core network? We need this figure to assess whether the node is approaching its session capacity threshold during this evening peak traffic window.
  domain: core
  expected_complexity: simple
  criticality: med
  slice_type: null
- id: core-read-upf-n6-latency
  text: What is the current one-way latency on the N6 interface of UPF upf-north-02 toward the external data network? Operations team needs a snapshot reading right now to confirm the link is performing within the agreed baseline before the maintenance window opens.
  domain: core
  expected_complexity: simple
  criticality: med
  slice_type: null
- id: core-read-amf-cpu-load
  text: What is the current CPU utilisation percentage on AMF amf-west-01 at this moment? The on-call engineer reported sluggish NAS signalling responses and needs a quick health check before escalating to the vendor support team for further investigation.
  domain: core
  expected_complexity: simple
  criticality: high
  slice_type: null
- id: core-read-ausf-auth-failures
  text: How many UE authentication failures has AUSF ausf-core-01 logged in the last fifteen minutes? The security operations team flagged an anomaly alert and requires the current failure count to determine whether a credential-stuffing incident is in progress.
  domain: core
  expected_complexity: simple
  criticality: high
  slice_type: null
- id: core-read-upf-pdu-count-urllc
  text: How many URLLC PDU sessions are currently anchored on UPF upf-edge-05 for network slice SST-2? Please provide the live session count so the slice operations team can confirm capacity headroom before the industrial automation customer's shift begins.
  domain: core
  expected_complexity: simple
  criticality: high
  slice_type: urllc
- id: core-read-smf-n4-status
  text: Is the N4 interface between SMF smf-south-02 and UPF upf-south-01 currently operational and stable? The provisioning team needs a quick status confirmation before pushing a new QoS policy update that depends on this control-plane path being fully available.
  domain: core
  expected_complexity: simple
  criticality: high
  slice_type: null
- id: core-read-nrf-registered-nfs
  text: How many network functions are currently registered with NRF nrf-central-01 in the production core? The platform team needs this count to verify that all expected NF instances checked in successfully following this morning's scheduled software upgrade cycle.
  domain: core
  expected_complexity: simple
  criticality: med
