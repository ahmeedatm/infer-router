  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-rsrp-degradation-cell-sector-correlation
  text: RSRP measurements on cell gNB-203 sector 2 have dropped below -110 dBm for roughly 40% of attached UEs over the last two hours. Cross-reference with sector 1 and sector 3 on the same gNB to determine whether the degradation is sector-specific or a site-wide antenna feeder issue, and recommend corrective action within the existing tilt and power budget constraints.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-urllc-latency-breach-gnb-155
  text: End-to-end latency for URLLC slice on gNB-155 has breached the 1 ms air-interface budget three times in the last scheduling cycle. Determine whether the root cause is insufficient semi-persistent scheduling grants or excessive HARQ retransmissions on the uplink, and propose the minimal reconfiguration to restore compliance without reallocating PRBs from the colocated eMBB slice, ensuring no URLLC session is dropped during the adjustment window.
  domain: ran
  expected_complexity: medium
  criticality: high
  slice_type: urllc
- id: ran-cqi-drop-correlation-interference
  text: Average CQI on gNB-089 cells 4 and 5 fell from 11 to 6 between 14:00 and 15:30 UTC today. Correlate with neighboring gNB-090 transmit power logs to assess whether an inter-site interference event is responsible, and recommend whether power control or ICIC reconfiguration should be applied first, respecting the maximum EIRP limit of 46 dBm already configured on both sites.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-handover-ping-pong-gnb-031-032
  text: Ping-pong handover count between gNB-031 and gNB-032 has increased by 35% since the last parameter push. Diagnose whether the A3 offset or the time-to-trigger value is misconfigured on either node, and suggest the corrected parameter value that will reduce ping-pong rate below the 2% threshold without degrading coverage at the cell edge shared by both sites.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-beam-failure-recovery-mmwave
  text: Beam failure recovery requests on mmWave cell gNB-501 are averaging 12 per minute. Identify the dominant beam pair causing failures.
  domain: ran
  expected_complexity: medium
  criticality: high
  slice_type: null
- id: ran-prach-congestion-mmtc-slice
  text: PRACH collision rate on the mMTC slice at gNB-144 has risen to 18%. Recommend a preamble format or root sequence reconfiguration.
  domain: ran
  expected_complexity: medium
  criticality: low
  slice_type: mmtc
- id: ran-downlink-throughput-drop-gnb-066
  text: Downlink throughput on gNB-066 cell 1 dropped 40% at midnight. What changed in the scheduler configuration?
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-ta-overflow-dense-urban-gnb-211
  text: Timing advance values reported by UEs on gNB-211 are consistently hitting the maximum TA index, suggesting cell radius misconfiguration. Verify the configured cell range against the physical site survey data and recommend whether a cell split or a guard period adjustment is the appropriate fix under current load conditions.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: null
- id: ran-rlf-rate-increase-gnb-078-sector3
  text: Radio link failure rate on gNB-078 sector 3 increased from 0.3% to 2.1% following last night's software upgrade to version 22.4.1. Determine whether the RLF spike correlates with the new T310 timer default introduced in that release, and advise whether rolling back the timer to the previous 1000 ms value or applying the vendor hotfix patch is the lower-risk remediation path given current sector load.
  domain: ran
  expected_complexity: medium
  criticality: high
  slice_type: null
- id: ran-srs-configuration-uplink-coverage
  text: UEs at the cell edge of gNB-199 report consistently poor uplink CQI despite adequate RSRP. Assess whether the current SRS periodicity of 160 ms is too infrequent for accurate uplink channel estimation at this site and propose a revised periodicity value.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-ca-deactivation-rate-gnb-045
  text: Carrier aggregation secondary cell deactivation rate on gNB-045 has doubled in the past 24 hours. Correlate with thermal alarms on the baseband unit to determine if hardware throttling is causing the SCG releases.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-massive-mimo-beam-tilt-reconfiguration
  text: Drive test data shows a coverage hole 800 metres north-east of gNB-302 that was not present before the massive MIMO beam weight update applied on Monday. Identify which digital beam index was modified, assess the impact on the coverage footprint using the before-and-after RSRP delta maps, and recommend the corrected beam weight vector that restores coverage to the affected area without creating a new interference lobe toward gNB-305.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-x2-link-latency-gnb-055-056
  text: X2 interface latency between gNB-055 and gNB-056 has increased to 28 ms, impacting coordinated scheduling. Diagnose the cause and recommend a fix.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: null
- id: ran-slice-prb-quota-rebalance-gnb-120
  text: On gNB-120, the eMBB slice is consistently consuming 15% more PRBs than its configured quota of 60%, causing the URLLC slice to miss its guaranteed minimum of 20% in busy-hour periods. Determine whether the overflow is driven by a small number of high-throughput UEs or by a general load increase, and recommend whether a stricter per-UE scheduling cap or a dynamic quota adjustment policy is the correct intervention to restore slice isolation without degrading aggregate cell throughput below the current 850 Mbps baseline.
  domain: ran
  expected_complexity: medium
  criticality: high
  slice_type: urllc
- id: ran-pucch-format-mismatch-gnb-088
  text: PUCCH format 0 is configured on gNB-088 but UE capability reports indicate format 2 support. Recommend whether renegotiation is warranted.
  domain: ran
  expected_complexity: medium
  criticality: low
  slice_type: null
- id: ran-idle-mode-reselection-loop-gnb-017
  text: UEs are looping between gNB-017 and a legacy LTE cell every 30 seconds in idle mode. Check reselection thresholds.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: null
- id: ran-gnb-du-cpu-overload-scheduling-impact
  text: gNB-DU-07 CPU utilization has been above 85% for six consecutive 15-minute intervals, and MAC scheduling delay has increased proportionally. Determine whether the overload originates from an abnormal number of active RRC connections, a misconfigured measurement reporting interval flooding the DU, or a software thread contention issue introduced in the last O-DU software patch.
  domain: ran
  expected_complexity: medium
  criticality: high
  slice_type: null
- id: ran-ssb-periodicity-adjustment-gnb-400
  text: Reduce SSB periodicity on gNB-400 to improve idle-mode detection latency.
  domain: ran
  expected_complexity: medium
  criticality: low
  slice_type: null
- id: ran-inter-frequency-load-balancing-gnb-061-062
  text: gNB-061 operating on n78 is at 88% PRB load while the collocated n41 carrier on gNB-062 sits at 34% utilization. Evaluate whether activating inter-frequency load balancing via B2 event-triggered measurement reports will effectively offload UEs from n78 to n41, identify the optimal B2 threshold pair given current RSRP distributions on both carriers, and confirm that the proposed threshold change will not trigger excessive inter-frequency handovers for UEs with marginal n41 coverage.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: embb
- id: ran-ue-context-release-cause-analysis-gnb-033
  text: UE context release cause code 'radio-connection-with-UE-lost' has spiked on gNB-033 sector 1 over the last three hours. Correlate with RSRP and SINR trends to identify whether the releases are concentrated at the cell edge or distributed across the sector.
  domain: ran
  expected_complexity: medium
  criticality: med
  slice_type: null
- id: ran-multicell-prb-latency-energy-arbitration
  text: Cells gNB-101 through gNB-108 in the industrial park cluster are simultaneously serving an URLLC automation slice and two eMBB video slices during a shift-change surge. Redistribute PRB allocations across all eight cells so that URLLC one-way latency stays below 1 ms, eMBB throughput per UE remains above 50 Mbps, and aggregate site power does not exceed the 48 kW grid contract, while keeping Xn handover interruption time under 10 ms for any cross-cell mobility event.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-cqi-rsrp-admission-revenue-balance
  text: gNB-202 and gNB-203 are at 85 percent PRB utilisation. Four new eMBB sessions with differing ARPU weights are queued. Admit sessions maximising revenue while holding edge-user RSRP above -105 dBm, average CQI above 9, and total PRB load below 95 percent across both cells, accounting for inter-cell interference coupling on the shared 3.5 GHz carrier.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: embb
- id: ran-slice-isolation-breach-remediation
  text: URLLC slice SST-1 SD-0x001 on gNB-055 is leaking PRBs into mMTC slice SST-3. Restore strict isolation immediately.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-amf-smf-upf-path-reoptimise
  text: UPF-7 N3 interface utilisation exceeded 90 percent. Migrate affected PDU sessions to UPF-9 without dropping URLLC flows.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-energy-sleep-coverage-mmtc-sla
  text: Suburban gNB-310 through gNB-315 idle power is over budget at night. Schedule deep-sleep cycles without breaking mMTC device reachability SLA.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: mmtc
- id: ran-massive-mimo-beam-prb-thermal-cooptimise
  text: gNB-401 massive-MIMO array is reporting thermal headroom below 8 percent while serving 340 active UEs across SSB beams 1 through 16. Reduce beam transmit power on the four hottest antenna panels without degrading average SINR below 12 dB or dropping any URLLC session, and simultaneously defer non-urgent eMBB PRB grants to stay within the 200 W per-panel thermal limit.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-cross-layer-qos-handover-budget-optimise
  text: A high-speed rail corridor served by gNB-501, gNB-502, and gNB-503 is experiencing handover ping-pong for UEs travelling at 280 km/h. Retune A3 offset and time-to-trigger parameters across all three cells jointly so that handover failure rate drops below 0.5 percent, URLLC re-establishment latency stays under 5 ms, and eMBB session continuity loss stays below 50 ms, without creating coverage gaps in the overlap zones between cells.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-n6-congestion-slice-throttle-arbitration
  text: N6 egress on UPF-3 is saturated. Throttle eMBB slice without impacting URLLC or mMTC SLAs on gNB-210 cluster.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: embb
- id: ran-multitenant-prb-revenue-isolation-optimise
  text: 'Three enterprise tenants share gNB-601 and gNB-602 under separate network slice agreements: Tenant-A holds a guaranteed 40 percent PRB reservation for URLLC, Tenant-B holds 35 percent for eMBB, and Tenant-C holds best-effort mMTC. A traffic spike from Tenant-B is eroding Tenant-A''s latency budget. Reallocate shared PRB pools, adjust scheduler weights, and update QoS flow priorities on both cells so that Tenant-A URLLC latency stays below 2 ms, Tenant-B throughput does not fall below contracted 200 Mbps, and Tenant-C device reachability remains above 99.5 percent, while maximising aggregate weighted revenue.'
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-ausf-auth-storm-ran-resource-shield
  text: AUSF-2 is processing an authentication storm from 12,000 simultaneous mMTC device attach requests funnelled through gNB-701 and gNB-702. Rate-limit RRC connection establishment on both cells to protect AUSF-2 signalling capacity below 8,000 requests per second, while ensuring that already-authenticated URLLC UEs retain uninterrupted radio bearers, eMBB sessions maintain throughput above 20 Mbps, and the AMF-1 overload control timer does not trigger, coordinating admission control thresholds across the N1 and N2 interfaces simultaneously.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: mmtc
- id: ran-carrier-aggregation-interference-power-balance
  text: gNB-801 is operating carrier aggregation on 3.5 GHz CC1 and 26 GHz CC2 for 180 eMBB UEs. Uplink interference on CC2 from adjacent gNB-802 is pushing BLER above 10 percent. Jointly optimise CC2 uplink power control, CC1 PRB scheduling, and inter-cell interference coordination with gNB-802 so that CC2 BLER drops below 2 percent, aggregate downlink throughput per UE stays above 800 Mbps, and total radiated power across both carriers remains within the 43 dBm EIRP regulatory cap.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: embb
- id: ran-dynamic-tdd-pattern-urllc-embb-coexistence
  text: gNB-901 uses a dynamic TDD pattern shared between URLLC slice SST-1 and eMBB slice SST-2. A factory automation event is demanding a burst of uplink URLLC traffic for 15 minutes. Reconfigure the TDD slot ratio from 7D-2U-1S to 4D-5U-1S on gNB-901 without causing cross-link interference to neighbouring gNB-902 and gNB-903, keeping eMBB downlink throughput above 150 Mbps and URLLC uplink latency below 0.5 ms, and reverting automatically when the automation burst subsides, all while respecting the 3GPP semi-persistent scheduling constraints for the URLLC bearers.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-prb-forecast-preemptive-slice-admission
  text: Predicted PRB demand on gNB-1001 cluster will hit 92 percent in 45 minutes based on historical patterns. Pre-emptively adjust slice admission thresholds to prevent SLA breach.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: embb
- id: ran-smf-pdu-session-anchor-failover-ran-impact
  text: SMF-4 is failing over PDU session anchors from UPF-11 to UPF-12 for 3,200 active sessions. Ensure gNB-1101 path-switch signalling completes within N2 budget.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-energy-harvesting-site-sleep-sla-multiband
  text: Solar-powered remote site hosting gNB-1201 operates on a 10 kWh daily energy budget shared across 700 MHz, 2.1 GHz, and 3.5 GHz carriers. Optimise carrier activation schedule and transmit power per band throughout a 24-hour cycle so that mMTC reachability stays above 99.9 percent, eMBB peak-hour throughput exceeds 100 Mbps, URLLC availability remains at five-nines, and total energy consumption does not exceed the daily budget, while accounting for forecast solar irradiance variations and UE demand profiles per band.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: mmtc
- id: ran-inter-rat-lte-nr-load-migration-sla
  text: Legacy LTE eNB-301 and NR gNB-1301 overlap in the same sector. Migrate eMBB UEs to NR while preserving VoLTE QoS on LTE.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: embb
- id: ran-ric-xapp-conflict-prb-qos-resolution
  text: 'Two xApps deployed on the Near-RT RIC are issuing conflicting E2 control messages to gNB-1401: xApp-A is reducing PRB grants to lower interference, while xApp-B is increasing PRB grants to meet eMBB throughput SLAs for 260 active UEs. Arbitrate the conflict by enforcing a priority-ordered policy that guarantees URLLC QoS flows at QFI-1 are unaffected, eMBB aggregate throughput stays above 1.2 Gbps, interference to neighbouring gNB-1402 stays below the -6 dB SINR degradation threshold, and both xApps receive consistent E2 SM feedback to prevent re-oscillation.'
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-mmtc-massive-attach-prb-signalling-cap
  text: 50,000 mMTC sensors on gNB-1501 are scheduled to report simultaneously. Cap RACH load below 60 percent PRB while preserving URLLC and eMBB sessions.
  domain: ran
  expected_complexity: complex
  criticality: med
  slice_type: mmtc
- id: ran-spectrum-sharing-dss-slice-kpi-cooptimise
  text: gNB-1601 uses dynamic spectrum sharing between NR and LTE on 1800 MHz. Current DSS weight is 50/50 but NR URLLC latency is breaching 1 ms SLA. Rebalance DSS resource split across 100 PRBs so that NR URLLC latency drops below 1 ms, LTE eMBB users maintain RSRP above -100 dBm and throughput above 30 Mbps, spectral efficiency across the shared band improves by at least 10 percent, and the rebalancing does not trigger unnecessary inter-RAT handovers for 1,400 attached LTE devices.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
- id: ran-fronthaul-capacity-cell-split-power-optimise
  text: Fronthaul link between BBU-pool-7 and RRH-cluster-C is at 94 percent capacity, serving gNB-1701 through gNB-1704. Reduce fronthaul load by coordinating cell-splitting gain, downlink MIMO layer reduction, and transmit power scaling across all four RRHs so that fronthaul utilisation drops below 75 percent, no eMBB UE throughput falls below 80 Mbps, URLLC latency budget is not impacted, and the combined EIRP across the cluster stays within the site licence limit of 4 times 46 dBm, while maintaining neighbour-cell RSRP handover margins above 3 dB.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: embb
- id: ran-qos-flow-preemption-urllc-congestion-event
  text: Sudden eMBB traffic surge on gNB-1801 is crowding out URLLC QoS flows at QFI-1 and QFI-2 for 80 industrial UEs. Preempt lower-priority flows immediately.
  domain: ran
  expected_complexity: complex
  criticality: high
  slice_type: urllc
