# Configuration explicite du linter, pour que le résultat local et le résultat
# de la CI soient identiques et stables dans le temps. Sans elle, ruff applique
# le jeu de règles par défaut de la version installée, qui évolue d'une release
# à l'autre : la CI passait au vert puis rouge sans qu'une ligne de code change.

# Version réellement livrée : le Dockerfile part de python:3.9-slim. Déclarer la
# cible évite que le linter réclame une syntaxe indisponible à l'exécution,
# comme `X | None` en annotation, qui demande 3.10.
target-version = "py39"

line-length = 100

[lint]
# Erreurs de syntaxe et pyflakes (imports inutilisés, noms indéfinis), plus le
# tri des imports et les pièges courants. Volontairement resserré : un lint qui
# signale du style discutable finit par être ignoré, donc par ne plus rien
# signaler du tout.
select = ["E4", "E7", "E9", "F", "I", "B"]

[lint.per-file-ignores]
# Les tests instancient des modèles pydantic dont les erreurs de validation
# sont précisément l'objet du test.
"tests/**" = ["B017"]
