# Sous-ensemble réalisable sur banc Mininet+ONOS. topology: linear3 (h1-h2-h3)
# ou diamond (h1 -> {large|étroit} -> h2). Endpoints logiques -> hôtes Mininet.

# --- reachability (4) : HostToHostIntent, ground_truth ping_ok ---
- intent_id: reach-001
  text: "Ensure the edge monitoring host can reach the core telemetry collector."
  domain: core
  criticality: med
  klass: reachability
  topology: linear3
  endpoints:
    edge_mon: {host: h1, mac: "00:00:00:00:00:01"}
    core_tel: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_ok, src: edge_mon, dst: core_tel}

- intent_id: reach-002
  text: "Allow the RAN base station to reach the core orchestrator for configuration sync."
  domain: ran
  criticality: high
  klass: reachability
  topology: linear3
  endpoints:
    ran_bs: {host: h1, mac: "00:00:00:00:00:01"}
    core_orch: {host: h2, mac: "00:00:00:00:00:02"}
  ground_truth: {check: ping_ok, src: ran_bs, dst: core_orch}

- intent_id: reach-003
  text: "Establish connectivity between the security probe and the log aggregator."
  domain: security
  criticality: med
  klass: reachability
  topology: linear3
  endpoints:
    sec_probe: {host: h2, mac: "00:00:00:00:00:02"}
    log_agg: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_ok, src: sec_probe, dst: log_agg}

- intent_id: reach-004
  text: "Make sure the slice controller can reach the RAN scheduler for slice provisioning."
  domain: slice
  criticality: med
  klass: reachability
  topology: linear3
  endpoints:
    slice_ctrl: {host: h1, mac: "00:00:00:00:00:01"}
    ran_sched: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_ok, src: slice_ctrl, dst: ran_sched}

# --- isolation (4) : ACL deny, ground_truth ping_fail ---
- intent_id: sec-001
  text: "Block all traffic from the RAN management host to the billing host."
  domain: security
  criticality: high
  klass: isolation
  topology: linear3
  endpoints:
    ran_mgmt: {host: h1, mac: "00:00:00:00:00:01"}
    billing: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_fail, src: ran_mgmt, dst: billing}

- intent_id: sec-002
  text: "Isolate the guest diagnostic host from the core billing system entirely."
  domain: security
  criticality: high
  klass: isolation
  topology: linear3
  endpoints:
    guest_diag: {host: h2, mac: "00:00:00:00:00:02"}
    core_billing: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_fail, src: guest_diag, dst: core_billing}

- intent_id: sec-003
  text: "Deny any connection between the legacy RAN probe and the security operations host."
  domain: security
  criticality: high
  klass: isolation
  topology: linear3
  endpoints:
    legacy_ran: {host: h1, mac: "00:00:00:00:00:01"}
    sec_ops: {host: h2, mac: "00:00:00:00:00:02"}
  ground_truth: {check: ping_fail, src: legacy_ran, dst: sec_ops}

- intent_id: sec-004
  text: "Cut off the compromised slice tenant host from the core telemetry collector."
  domain: slice
  criticality: high
  klass: isolation
  topology: linear3
  endpoints:
    compromised_tenant: {host: h1, mac: "00:00:00:00:00:01"}
    core_tel2: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_fail, src: compromised_tenant, dst: core_tel2}

# --- qos (4) : PointToPointIntent + BandwidthConstraint, ground_truth throughput_min ---
- intent_id: slice-001
  text: "Guarantee at least 8 Mbps for the URLLC slice between site A and site B."
  domain: slice
  criticality: high
  klass: qos
  topology: diamond
  endpoints:
    site_a: {host: h1, mac: "00:00:00:00:00:01"}
    site_b: {host: h2, mac: "00:00:00:00:00:02"}
  ground_truth: {check: throughput_min, src: site_a, dst: site_b, min_mbps: 8.0}

- intent_id: slice-002
  text: "Reserve at least 20 Mbps of bandwidth for the eMBB slice from the RAN edge to the core."
  domain: slice
  criticality: med
  klass: qos
  topology: diamond
  endpoints:
    ran_edge: {host: h1, mac: "00:00:00:00:00:01"}
    core_gw: {host: h2, mac: "00:00:00:00:00:02"}
  ground_truth: {check: throughput_min, src: ran_edge, dst: core_gw, min_mbps: 20.0}

- intent_id: slice-003
  text: "Ensure a minimum of 5 Mbps throughput for the mMTC telemetry uplink."
  domain: slice
  criticality: low
  klass: qos
  topology: diamond
  endpoints:
    mmtc_sensor: {host: h1, mac: "00:00:00:00:00:01"}
    mmtc_collector: {host: h2, mac: "00:00:00:00:00:02"}
  ground_truth: {check: throughput_min, src: mmtc_sensor, dst: mmtc_collector, min_mbps: 5.0}

- intent_id: slice-004
  text: "Provision at least 15 Mbps for the priority video feed between the field unit and the ops center."
  domain: core
  criticality: high
  klass: qos
  topology: diamond
  endpoints:
    field_unit: {host: h1, mac: "00:00:00:00:00:01"}
    ops_center: {host: h2, mac: "00:00:00:00:00:02"}
  ground_truth: {check: throughput_min, src: field_unit, dst: ops_center, min_mbps: 15.0}
