# Sous-ensemble réalisable sur banc Mininet + OVS (sans contrôleur externe).
# topology: linear3 (h1 et h2 sur s1, h3 sur s2). Endpoints logiques -> hôtes.

# --- reachability (4) : connectivité par défaut (standalone), ground_truth ping_ok ---
- intent_id: reach-001
  text: "Ensure the edge monitoring host can reach the core telemetry collector."
  domain: core
  criticality: med
  klass: reachability
  topology: linear3
  endpoints:
    edge_mon: {host: h1, mac: "00:00:00:00:00:01"}
    core_tel: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_ok, src: edge_mon, dst: core_tel}
  expected_complexity: simple
  checks:
    - {check: ping_ok, src: edge_mon, dst: core_tel}

- intent_id: reach-002
  text: "Allow the RAN base station to reach the core orchestrator for configuration sync."
  domain: ran
  criticality: high
  klass: reachability
  topology: linear3
  endpoints:
    ran_bs: {host: h1, mac: "00:00:00:00:00:01"}
    core_orch: {host: h2, mac: "00:00:00:00:00:02"}
  ground_truth: {check: ping_ok, src: ran_bs, dst: core_orch}
  expected_complexity: simple
  checks:
    - {check: ping_ok, src: ran_bs, dst: core_orch}

- intent_id: reach-003
  text: "Establish connectivity between the security probe and the log aggregator."
  domain: security
  criticality: med
  klass: reachability
  topology: linear3
  endpoints:
    sec_probe: {host: h2, mac: "00:00:00:00:00:02"}
    log_agg: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_ok, src: sec_probe, dst: log_agg}
  expected_complexity: simple
  checks:
    - {check: ping_ok, src: sec_probe, dst: log_agg}

- intent_id: reach-004
  text: "Make sure the slice controller can reach the RAN scheduler for slice provisioning."
  domain: slice
  criticality: med
  klass: reachability
  topology: linear3
  endpoints:
    slice_ctrl: {host: h1, mac: "00:00:00:00:00:01"}
    ran_sched: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_ok, src: slice_ctrl, dst: ran_sched}
  expected_complexity: simple
  checks:
    - {check: ping_ok, src: slice_ctrl, dst: ran_sched}

# --- isolation (4) : drop flow-mods OVS, ground_truth ping_fail ---
- intent_id: sec-001
  text: "Block all traffic from the RAN management host to the billing host."
  domain: security
  criticality: high
  klass: isolation
  topology: linear3
  endpoints:
    ran_mgmt: {host: h1, mac: "00:00:00:00:00:01"}
    billing: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_fail, src: ran_mgmt, dst: billing}
  expected_complexity: simple
  checks:
    - {check: ping_fail, src: ran_mgmt, dst: billing}

- intent_id: sec-002
  text: "Isolate the guest diagnostic host from the core billing system entirely."
  domain: security
  criticality: high
  klass: isolation
  topology: linear3
  endpoints:
    guest_diag: {host: h2, mac: "00:00:00:00:00:02"}
    core_billing: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_fail, src: guest_diag, dst: core_billing}
  expected_complexity: simple
  checks:
    - {check: ping_fail, src: guest_diag, dst: core_billing}

- intent_id: sec-003
  text: "Deny any connection between the legacy RAN probe and the security operations host."
  domain: security
  criticality: high
  klass: isolation
  topology: linear3
  endpoints:
    legacy_ran: {host: h1, mac: "00:00:00:00:00:01"}
    sec_ops: {host: h2, mac: "00:00:00:00:00:02"}
  ground_truth: {check: ping_fail, src: legacy_ran, dst: sec_ops}
  expected_complexity: simple
  checks:
    - {check: ping_fail, src: legacy_ran, dst: sec_ops}

- intent_id: sec-004
  text: "Cut off the compromised slice tenant host from the core telemetry collector."
  domain: slice
  criticality: high
  klass: isolation
  topology: linear3
  endpoints:
    compromised_tenant: {host: h1, mac: "00:00:00:00:00:01"}
    core_tel2: {host: h3, mac: "00:00:00:00:00:03"}
  ground_truth: {check: ping_fail, src: compromised_tenant, dst: core_tel2}
  expected_complexity: simple
  checks:
    - {check: ping_fail, src: compromised_tenant, dst: core_tel2}

# --- qos (4) : plafonnement de débit (ingress policing OVS), ground_truth throughput_max ---
- intent_id: slice-001
  text: "Cap the best-effort slice between site A and site B at 8 Mbps."
  domain: slice
  criticality: high
  klass: qos
  topology: linear3
  endpoints:
    site_a: {host: h1, mac: "00:00:00:00:00:01"}
    site_b: {host: h2, mac: "00:00:00:00:00:02"}
  ground_truth: {check: throughput_max, src: site_a, dst: site_b, max_mbps: 8.0}
  expected_complexity: simple
  checks:
    - {check: throughput_max, src: site_a, dst: site_b, max_mbps: 8.0}

- intent_id: slice-002
