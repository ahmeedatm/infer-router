name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Lint (Ruff)
        run: ruff check .

      # Tests unitaires uniquement : déterministes, sans réseau ni service.
      # Les tests d'intégration (tests/integration/) requièrent Ollama/Redis
      # et ne sont pas exécutés en CI.
      - name: Tests (Pytest)
        run: pytest tests/unit -q
